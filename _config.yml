title: Hongli Ye
name: Hongli Ye
description: Mathematics student at SUSTech. Notes on geometry, topology, and life along the way.
url: https://hongliye7458.github.io
baseurl: ""
repository: hongliye7458/hongliye7458.github.io
locale: en-US
remote_theme: mmistakes/minimal-mistakes@4.28.1
minimal_mistakes_skin: default
markdown: kramdown
kramdown:
  math_engine: mathjax
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-sitemap
search: false
breadcrumbs: false
atom_feed:
  hide: true
author:
  name: Hongli Ye
  bio: Mathematics undergraduate<br>Southern University of Science and Technology
defaults:
  - scope:
      path: ""
    values:
      layout: single
      author_profile: false
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: true
      show_date: true
      share: false
      related: false
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - scripts
